<div id="fade"></div>

<div id="dialogueBox">
  <div id="dialogueText"></div>
</div>

<!-- 🗺️ MAP SCREEN -->
<div id="mapScreen" class="screen active">
  <h1>🏫 School Map</h1>

  <div class="map-grid">
    <button onclick="enterRoom('classroom')">Classroom</button>
    <button onclick="enterRoom('hallway')">Hallway</button>
    <button onclick="enterRoom('lockers')">Lockers</button>
    <button onclick="enterRoom('library')">Library</button>
  </div>

  <button onclick="startGame()">Start Game</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="screen">
  <div id="hud">
    <h3>Inventory</h3>
    <div id="inventory"></div>

    <button onclick="openMap()">Map</button>
  </div>

  <div id="screen">
    <h2 id="room-title"></h2>
    <div id="room-content"></div>
  </div>
</div>
